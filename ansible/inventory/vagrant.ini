# Vagrant forwards WinRM (HTTP 5985 in the guest); host ports match the Vagrantfile.
[dc]
HYDRA-DC ansible_host=127.0.0.1 ansible_port=55985 ws_name=HYDRA-DC

[workstations]
THEPUNISHER ansible_host=127.0.0.1 ansible_port=55986 ws_name=THEPUNISHER ws_ip=10.0.2.11
SPIDERMAN   ansible_host=127.0.0.1 ansible_port=55987 ws_name=SPIDERMAN   ws_ip=10.0.2.12

[all:vars]
lab_platform=vagrant
ansible_connection=winrm
# Non-standard ports -> scheme must be explicit (pywinrm assumes https otherwise).
ansible_winrm_scheme=http
# NTLM (message-encrypted), not Basic: Basic only works for LOCAL accounts, and
# after promotion the DC has none — `vagrant` becomes MARVEL\vagrant.
ansible_winrm_transport=ntlm
ansible_user=vagrant
ansible_password=vagrant
