# Vagrant forwards WinRM; these host/port pairs match the Vagrantfile.
[dc]
HYDRA-DC ansible_host=127.0.0.1 ansible_port=55985 ws_name=HYDRA-DC

[workstations]
THEPUNISHER ansible_host=127.0.0.1 ansible_port=55986 ws_name=THEPUNISHER ws_ip=10.0.2.11
SPIDERMAN   ansible_host=127.0.0.1 ansible_port=55987 ws_name=SPIDERMAN   ws_ip=10.0.2.12

[all:vars]
ansible_connection=winrm
ansible_user=vagrant
ansible_password=vagrant
ansible_winrm_transport=basic
ansible_winrm_server_cert_validation=ignore
dc_admin_password=P@$$w0rd
