---
# =============================================================================
#  site.yml — master playbook
#  Builds the entire MARVEL.local domain. Platform-agnostic: the same play runs
#  against Vagrant-provisioned VMs and Azure VMs (both reached over WinRM).
#
#  Order matters: the DC must be fully promoted before the workstations try to
#  join, so the two plays run in sequence.
# =============================================================================

# ---- Play 1: Domain Controller ---------------------------------------------
- name: Build the Domain Controller
  hosts: dc
  gather_facts: false
  roles:
    - domain_controller

# ---- Play 2: Workstations (join the domain built above) --------------------
- name: Configure domain workstations
  hosts: workstations
  gather_facts: false
  vars:
    # per-host name/ip come from inventory; pass the DA password through
    domain_admin_password: "{{ hostvars['dc']['dc_admin_password'] | default('P@$$w0rd') }}"
  roles:
    - domain_member
