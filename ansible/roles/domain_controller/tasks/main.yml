---
# =============================================================================
#  Role: domain_controller
#  Promotes HYDRA-DC to a new forest, installs AD CS, and applies the full
#  MARVEL.local config (users, groups, SPN, share, Defender GPO).
# =============================================================================

# ---- 1. Networking ---------------------------------------------------------
- name: Set static IPv4 address on the DC
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $ifn = (Get-NetAdapter | Where-Object Status -eq 'Up' | Select-Object -First 1).Name
      # Clear any DHCP lease, pin static
      Get-NetIPAddress -InterfaceAlias $ifn -AddressFamily IPv4 -ErrorAction SilentlyContinue |
        Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue
      Remove-NetRoute -InterfaceAlias $ifn -Confirm:$false -ErrorAction SilentlyContinue
      New-NetIPAddress -InterfaceAlias $ifn -IPAddress '{{ dc_ip }}' `
        -PrefixLength 24 -DefaultGateway '{{ gateway }}'
      # DC points DNS at itself
      Set-DnsClientServerAddress -InterfaceAlias $ifn -ServerAddresses '127.0.0.1'
  register: dc_net
  changed_when: false
  failed_when: false   # idempotent re-runs may already have the address

# ---- 2. Rename + reboot ----------------------------------------------------
- name: Rename computer to {{ dc_hostname }}
  ansible.windows.win_hostname:
    name: "{{ dc_hostname }}"
  register: dc_rename

- name: Reboot after rename
  ansible.windows.win_reboot:
  when: dc_rename.reboot_required

# ---- 3. AD DS: promote to a new forest -------------------------------------
- name: Install AD DS role
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true
    state: present

- name: Create the forest / promote to DC
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    safe_mode_password: "{{ dsrm_password }}"
    reboot: true          # module waits for the DC to come back up

# ---- 4. AD CS (for later ADCS attacks) -------------------------------------
- name: Install AD CS role
  ansible.windows.win_feature:
    name: ADCS-Cert-Authority
    include_management_tools: true
    state: present

- name: Configure Enterprise Root CA
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      try {
        Install-AdcsCertificationAuthority -CAType EnterpriseRootCa -Force
      } catch {
        if ($_ -notmatch 'already installed') { throw }
      }
  changed_when: false
  failed_when: false

# ---- 5. Users --------------------------------------------------------------
- name: Create domain users
  microsoft.ad.user:
    name: "{{ item.sam }}"
    firstname: "{{ item.first }}"
    surname: "{{ item.last }}"
    password: "{{ item.password }}"
    password_never_expires: true
    description: "{{ item.description | default(omit) }}"
    state: present
  loop: "{{ domain_users }}"
  loop_control:
    label: "{{ item.sam }}"

- name: Add Domain Admins membership
  microsoft.ad.group:
    name: Domain Admins
    members:
      add: "{{ domain_users | selectattr('domain_admin') | map(attribute='sam') | list }}"
    state: present

# ---- 6. Kerberoasting SPN --------------------------------------------------
- name: Register SPN on the service account
  ansible.windows.win_shell: "setspn -s {{ spn.value }} {{ domain_netbios }}\\{{ spn.account }}"
  register: spn_out
  changed_when: "'Updated object' in spn_out.stdout"
  failed_when: spn_out.rc != 0 and 'Duplicate SPN' not in spn_out.stdout

# ---- 7. SMB share ----------------------------------------------------------
- name: Create share directory
  ansible.windows.win_file:
    path: "{{ smb_share.path }}"
    state: directory

- name: Create the SMB share (unencrypted — attacks rely on it)
  ansible.windows.win_share:
    name: "{{ smb_share.name }}"
    path: "{{ smb_share.path }}"
    full: Everyone

# ---- 8. Defender GPO (lab weakening) ---------------------------------------
- name: Apply Defender-disable GPO
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $gpoName = 'Disable Windows Defender'
      if (-not (Get-GPO -Name $gpoName -ErrorAction SilentlyContinue)) {
          New-GPO -Name $gpoName | New-GPLink -Target (Get-ADDomain).DistinguishedName
      }
      $key = 'HKLM\Software\Policies\Microsoft\Windows Defender'
      Set-GPRegistryValue -Name $gpoName -Key $key -ValueName 'DisableAntiSpyware' -Type DWord -Value 1
      Set-GPRegistryValue -Name $gpoName -Key "$key\Real-Time Protection" `
        -ValueName 'DisableRealtimeMonitoring' -Type DWord -Value 1
  when: disable_defender | bool
  changed_when: false

- name: "LAB NOTE — attack surface summary"
  ansible.builtin.debug:
    msg: >
      HYDRA-DC ready at {{ dc_ip }} for domain {{ domain_name }}.
      Users: {{ domain_users | map(attribute='sam') | join(', ') }}.
      SPN {{ spn.value }} registered. Share \\{{ dc_hostname }}\{{ smb_share.name }} created.
